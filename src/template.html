<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>
    <div class="img-wrapper">
      <div class="body">
        <div class="header">
          <h1>Battleship</h1>
        </div>
        
          <div class="main">
            <div class="p1 column">
              <div class="name">Player One</div>
              <div class="board-wrapper">
                <div class="ship-select">
                  <div class="ship carrier"></div>
                  <div class="ship battleship"></div>
                  <div class="ship destroyer"></div>
                  <div class="ship submarine"></div>
                  <div class="ship patrol-boat"></div>
                </div>
                <div class="board"></div>
              </div>
              <div class="ship-data"></div>
            </div>
            <div class="p2 column">
              <div class="name">Computer</div>
              <div class="board-wrapper">
                <div class="ship-select">
                  <div class="ship carrier"></div>
                  <div class="ship battleship"></div>
                  <div class="ship destroyer"></div>
                  <div class="ship submarine"></div>
                  <div class="ship patrol-boat"></div>
                </div>
                <div class="board"></div>
              </div>
            <div class="ship-data"></div>
          </div>
          </div>
      
        <div class="footer">
          <div class="text">
            Created by M.e.l.
          </div>
          <div class="icon">
            <a href="https://github.com/mel-121821/battleship" target="_blank">
              <img src="./icon/github.svg" alt="github logo">
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  </body>
</html>
