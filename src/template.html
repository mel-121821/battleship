<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>
    <dialog class="start">
      <form action="" method="post">
        <div class="form-title">
          <legend>Who is playing?</legend>
        </div>
        <div class="inputs">
          <legend>Player 1:</legend>
          <fieldset class="player-1">
            <input
              type="radio"
              id="p1-human"
              name="p1-type"
              value="human"
              checked
            />
            <label for="p1-human">Human</label>
            <input type="radio" id="p1-comp" name="p1-type" value="computer" />
            <label for="p1-comp">Computer</label>
          </fieldset>
          <label for="p1-name">Name:</label>
          <input type="text" id="p1-name" name="p1-name" />
          <legend>Player 2:</legend>
          <fieldset class="player-2">
            <input
              type="radio"
              id="p2-human"
              name="p2-type"
              value="human"
              checked
            />
            <label for="p2-human">Human</label>
            <input type="radio" id="p2-comp" name="p2-type" value="computer" />
            <label for="p2-comp">Computer</label>
          </fieldset>
          <label for="p2-name">Name</label>
          <input type="text" id="p2-name" name="p2-name" />
          <div class="start-btn">
            <input type="submit" value="Start Game!" />
          </div>
        </div>
      </form>
    </dialog>
    <dialog class="end-game">
      <button class="close">X</button>
      <p><span></span> wins!</p>
      <button class="replay">Play again</button>
    </dialog>
    <div class="img-wrapper">
      <div class="body">
        <div class="header">
          <h1>Battleship</h1>
        </div>
        <div class="main">
          <div id="p1" class="column">
            <dialog class="ships-dialog">
              <div>
                <legend>Place your ships <span></span>!</legend>
                <div>
                  <button class="pick">Pick my own</button>
                  <button class="randomize">Randomize</button>
                </div>
              </div>
            </dialog>
            <div class="name"><span>Player 1</span></div>
            <div class="board-wrapper">
              <div class="ship-select">
                <div class="carrier">
                  <img src="./icon/carrier.png" alt="carrier" />
                </div>
                <div class="battleship">
                  <img src="./icon/battleship.png" alt="battleship" />
                </div>
                <div class="destroyer">
                  <img src="./icon/destroyer.png" alt="destroyer" />
                </div>
                <div class="submarine">
                  <img src="./icon/submarine.png" alt="submarine" />
                </div>
                <div class="patrol-boat">
                  <img src="./icon/patrol-boat2.png" alt="patrol boat" />
                </div>
              </div>
              <div class="board"></div>
            </div>
            <div class="ship-data"></div>
          </div>
          <div id="p2" class="column">
            <dialog class="ships-dialog">
              <div>
                <legend>Place your ships <span></span>!</legend>
                <div>
                  <button class="pick">Pick my own</button>
                  <button class="randomize">Randomize</button>
                </div>
              </div>
            </dialog>
            <div class="name"><span>Player 2</span></div>
            <div class="board-wrapper">
              <div class="ship-select">
                <div class="carrier">
                  <img src="./icon/carrier.png" alt="carrier" />
                </div>
                <div class="battleship">
                  <img src="./icon/battleship.png" alt="battleship" />
                </div>
                <div class="destroyer">
                  <img src="./icon/destroyer.png" alt="destroyer" />
                </div>
                <div class="submarine">
                  <img src="./icon/submarine.png" alt="submarine" />
                </div>
                <div class="patrol-boat">
                  <img src="./icon/patrol-boat2.png" alt="patrol boat" />
                </div>
              </div>
              <div class="board"></div>
            </div>
            <div class="ship-data"></div>
          </div>
        </div>

        <div class="footer">
          <div class="text">Created by M.e.l.</div>
          <div class="icon">
            <a href="https://github.com/mel-121821/battleship" target="_blank">
              <img src="./icon/github.svg" alt="github logo" />
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
